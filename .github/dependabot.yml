version: 2

updates:
  # Versions live in Directory.Packages.props; Dependabot edits that file.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      microsoft:
        patterns:
          - 'Microsoft.*'
          - 'System.*'
      serilog:
        patterns:
          - 'Serilog*'
      test:
        patterns:
          - 'xunit*'
          - 'coverlet*'
          - 'Microsoft.NET.Test.Sdk'

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      next:
        patterns:
          - 'next'
          - 'eslint-config-next'
          - '@next/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    commit-message:
      prefix: 'chore(ci)'
